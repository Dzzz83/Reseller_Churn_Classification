[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reseller-churn-classification"
version = "0.1.0"
description = "Leakage-safe reseller churn classification pipeline"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["reseller_churn*", "comparisons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
reseller-churn = "reseller_churn.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reseller-churn-classification"
version = "0.1.0"
description = "Leakage-safe reseller churn classification pipeline"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["reseller_churn*", "comparisons*"]

[tool.pytest.ini_options]
# Default verification is self-contained. Historical/reference-data regressions
# remain available by passing their paths explicitly.
testpaths = [
    "tests/grouped",
    "tests/test_data.py",
    "tests/test_source_contract.py",
    "tests/test_model.py",
    "tests/test_artifacts.py",
    "tests/test_evaluation.py",
    "tests/test_pipeline.py",
    "tests/step_02_features/test_feature_snapshot_boundaries.py",
]

[project.scripts]
reseller-churn = "reseller_churn.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

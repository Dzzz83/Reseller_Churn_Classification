name: Grouped pipeline checks

on:
  push:
    branches: [main, pipeline_preparation, final-pipeline-preparation, 'refactor/**', 'research/**']
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-regression-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and verification tools
        run: python -m pip install '.[dev]'
      - name: Run self-contained grouped and core tests
        run: python -m pytest -q
      - name: Verify historical grouped research compatibility on synthetic cases
        run: >-
          python -m pytest -q comparisons/test_grouped_precision_recall.py
          tests/step_04_evaluation/test_fixed_feature_comparison.py
          tests/step_04_evaluation/test_period_weighting.py
          tests/step_04_evaluation/test_reseller_weighting.py
          tests/step_04_evaluation/test_precision_floor_october.py
          tests/step_04_evaluation/test_all_candidate_precision.py
      - name: Check supported implementation formatting and imports
        run: |
          ruff check reseller_churn pipeline/development_workflow.py pipeline/develop_models.py pipeline/prepare_data.py pipeline/run_full_development_pipeline.py pipeline/grouped_smoke_test.py pipeline/smoke_test.py tests/grouped tests/test_source_contract.py comparisons/grouped_precision_recall.py comparisons/period_weighting.py comparisons/precision_floor_october.py
          ruff format --check reseller_churn pipeline/development_workflow.py pipeline/develop_models.py pipeline/prepare_data.py pipeline/run_full_development_pipeline.py pipeline/grouped_smoke_test.py pipeline/smoke_test.py tests/grouped tests/test_source_contract.py comparisons/grouped_precision_recall.py comparisons/period_weighting.py comparisons/precision_floor_october.py
      - name: Run synthetic grouped end-to-end smoke
        run: python pipeline/grouped_smoke_test.py
      - name: Check installed command
        run: reseller-churn --help

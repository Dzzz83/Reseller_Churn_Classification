name: 01 Regression Tests

on:
  push:
    branches:
      - data_preparation
      - pipeline_preparation
  pull_request:

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 01 Checkout repository
        uses: actions/checkout@v4

      - name: 02 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 03 Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 04 Run regression tests
        run: pytest -q

      - name: 05 Verify source labels
        run: python comparisons/correlation_pruned_churn/01_verify_data_and_labels.py

      - name: 06 Verify feature calculations
        run: python comparisons/correlation_pruned_churn/02_verify_features.py

      - name: 07 Evaluate grouped and temporal designs
        run: |
          python comparisons/correlation_pruned_churn/03_compare_validation_strategies.py --include-unverified-store-profile
          python comparisons/correlation_pruned_churn/04_compare_with_baseline.py

      - name: 08 Reproduce original GroupKFold and corrected November audit
        run: python comparisons/correlation_pruned_churn/05_reproduce_corrected_original.py

      - name: 09 Archive comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correlation-pruned-churn-audit
          path: results/correlation_pruned_churn/*.csv
          if-no-files-found: ignore

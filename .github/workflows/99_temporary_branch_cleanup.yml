name: Temporary obsolete branch cleanup

on:
  push:
    branches:
      - data_preparation

permissions:
  contents: write

jobs:
  remove-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches already incorporated into data_preparation
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            audit/friend-method-corrected
            refactor/readable-oop-pipeline
            research/churn-method-comparison
            pipeline_preparation
          )

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          # Check every branch before deleting any.
          for branch in "${branches[@]}"; do
            git show-ref --verify --quiet "refs/remotes/origin/$branch"
            git merge-base --is-ancestor "origin/$branch" origin/data_preparation
            echo "Verified as merged: $branch"
          done

          git push origin --delete "${branches[@]}"

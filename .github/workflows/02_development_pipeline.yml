name: 02 Full Development Pipeline

on:
  push:
    branches:
      - pipeline_preparation
    paths:
      - "reseller_churn/**"
      - "pipeline/**"
      - "comparisons/**"
      - "debug/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".gitignore"
      - ".github/workflows/02_development_pipeline.yml"
  workflow_dispatch:

jobs:
  development-regression-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 01 Checkout repository
        uses: actions/checkout@v4

      - name: 02 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 03 Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 04 Run regression checks before preparation
        run: python -m pytest -q tests debug

      - name: 05 Run bounded real-data development smoke
        run: >-
          python -u pipeline/run_full_development_pipeline.py
          --architectures logistic_regression random_forest hist_gradient_boosting
          --feature-sets rfm
          --imbalance-strategies none balanced_weights random_oversampling
          --seeds 42

      - name: 06 Upload development output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-development-smoke-results
          path: |
            results/**
            models/provisional/**
          if-no-files-found: ignore
